<svg xmlns="http://www.w3.org/2000/svg" width="800" height="24" viewBox="0 0 800 24" fill="none">
  <defs>
    <linearGradient id="fade" x1="0" y1="12" x2="800" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-500%" width="140%" height="1100%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="800" y2="12" stroke="url(#fade)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity="0.85"/>
  <line x1="0" y1="12" x2="800" y2="12" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round"/>
</svg>
