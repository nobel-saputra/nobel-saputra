name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#ff00c8&color_dots=#ebedf0,#9be9f9,#00fff9,#ff6ae0,#ff00c8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00fff9&color_dots=#1a0b3d,#3b0f6b,#7a1fa8,#c400a0,#ff00c8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
